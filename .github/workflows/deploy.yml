name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Only the site lives in website/. Without this filter, committing any other
    # project in this monorepo would rebuild the site — and every build makes
    # ~148 SteamGridDB calls (37 games, looked up twice: once in games.astro,
    # once in games/[slug].astro).
    paths:
      - "website/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, and upload
        uses: withastro/action@v3
        with:
          # The Astro project lives in website/, not at the repo root.
          path: ./website
          node-version: 22
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          # Public URL, not a secret. Defaults to the snapshot published by
          # spotify.yml; set the repo variable to override (e.g. a live Worker).
          PUBLIC_SPOTIFY_ENDPOINT: ${{ vars.PUBLIC_SPOTIFY_ENDPOINT || 'https://raw.githubusercontent.com/Indiguana/indiguana.github.io/spotify-data/spotify.json' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
